name: TCTE 109 Official PDF Archive
on:
  push:
    branches:
      - exam-archive-109-20261123
permissions:
  contents: read
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Install HTML parser
        run: python3 -m pip install --quiet requests beautifulsoup4
      - name: Download and hash original TCTE PDFs
        run: python3 .github/scripts/download_tcte_109.py
      - name: Upload exam archive as artifact
        uses: actions/upload-artifact@v4
        with:
          name: tcte-109-official-original-pdfs
          path: output/
          if-no-files-found: error
          compression-level: 0
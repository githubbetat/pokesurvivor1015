name: TCTE 108 Official PDF Archive
on:
  push:
    branches:
      - exam-archive-109-20261123
permissions:
  contents: read
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Install HTML parser
        run: python3 -m pip install --quiet requests beautifulsoup4
      - name: Download and hash 108 original PDFs
        run: |
          sed -i 's/109_4y/108_4y/g;s/109-4y-/108-4y-/g;s/109 四技/108 四技/g' .github/scripts/download_tcte_109.py
          python3 .github/scripts/download_tcte_109.py
      - name: Upload exam archive
        uses: actions/upload-artifact@v4
        with:
          name: tcte-108-official-original-pdfs
          path: output/
          if-no-files-found: error
          compression-level: 0
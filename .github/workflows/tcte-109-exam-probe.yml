name: TCTE legacy original exams (94-90)
on:
  push:
    branches:
      - exam-archive-109-20261123
permissions:
  contents: read
jobs:
  download:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        roc: [94, 93, 92, 91, 90]
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      EXAM_ROC_${{ matrix.roc }}: ${{ matrix.roc }}
    steps:
      - uses: actions/checkout@v4
      - name: Install HTML parser
        run: python3 -m pip install --quiet requests beautifulsoup4
      - name: Download source PDFs and source-page originals
        run: |
          python3 .github/scripts/download_tcte_legacy.py
          python3 -c "import json; m=json.load(open('output/manifest.json')); print('RESULT',m['expected'],m['success'],m['failed'],m['pdfs'],m['images']); assert m['expected']>=5 and m['success']>0"
      - name: Upload originals and SHA256 provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tcte-${{ matrix.roc }}-legacy-original-files
          path: output/
          compression-level: 0
          if-no-files-found: warn